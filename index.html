<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/logo.png">
<title>Orçamentos · Nexux Marketing Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=1794321323">
</head>
<body class="home">
<script src="assets/config.js?v=1794321323"></script>
<script src="assets/eventos.js?v=1794321323"></script>
<script>
(function () {
  const nome = nomeCliente();
  const q = location.search;
  const cards = Object.entries(EVENTOS).map(([id, ev]) => `
    <a class="ev" href="${id}/${q}">
      <div class="eico">${icone(ev.icone, "")}</div>
      <h3>${ev.nome}</h3>
      <p>${ev.resumo}</p>
      <div class="from">a partir de <b>${brl(precoInicial(ev))}</b></div>
      <div class="go">Ver pacotes →</div>
    </a>`).join("");
  const esc = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  document.body.innerHTML = `
  <header class="hero"><div class="wrap">
    ${BRAND}
    ${nome ? `<div class="hello">Olá, ${esc(nome)}!</div>` : ""}
    <h1>Orçamento do seu <span>evento</span></h1>
    <p>Escolha o tipo de evento, veja os pacotes e monte o seu do jeito que preferir. O valor aparece na hora, sem precisar esperar resposta.</p>
    <div class="chips">
      <div class="chip">${icone("pin")}<b>${NEXUX.cidade}</b></div>
      <div class="chip">${icone("camera")}Fotos <b>sem limite</b></div>
      <div class="chip">${icone("relogio")}Prévia em até 48h</div>
    </div>
  </div></header>
  <main class="wrap" style="margin-top:-50px">
    <div class="events">${cards}
      <a class="ev other" href="#" id="outro">
        <div class="eico">${icone("chat", "")}</div>
        <h3>Outro evento</h3>
        <p>Formatura, 15 anos, chá revelação, evento de empresa... Fala com a gente que montamos sob medida.</p>
        <div class="go">Chamar no WhatsApp →</div>
      </a>
    </div>
    <h2 class="sec-t">Como funciona</h2>
    <p class="sec-s">Em três passos você já tem seu orçamento.</p>
    <div class="steps">
      <div class="step"><div class="num">1</div><h4>Escolha o evento</h4><p>Toque no tipo de evento que você vai fazer.</p></div>
      <div class="step"><div class="num">2</div><h4>Monte seu pacote</h4><p>Pegue um pacote pronto ou marque só o que quiser. O valor atualiza na hora.</p></div>
      <div class="step"><div class="num">3</div><h4>Envie pra gente</h4><p>Toque em "Enviar no WhatsApp" e a sua escolha chega direto pra nós.</p></div>
    </div>
    <p class="foot">Nexux Marketing Digital · ${NEXUX.cidade}</p>
  </main>`;
  document.getElementById("outro").onclick = e => {
    e.preventDefault();
    abrirWhatsApp((nome ? "Oi! Aqui é " + nome + ". " : "Oi! ") + "Queria um orçamento para outro tipo de evento.");
  };
})();
</script>
</body>
</html>
